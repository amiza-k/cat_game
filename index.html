<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>گربه‌های بامزه</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;background:#d8c298;font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
#app{position:relative;width:min(100vw,calc(100dvh*.625));aspect-ratio:400/640;--u:1px}
canvas#c{display:block;width:100%;height:100%}
.pill{position:absolute;top:calc(14*var(--u));display:flex;align-items:center;gap:calc(8*var(--u));padding:calc(6*var(--u)) calc(14*var(--u));border-radius:calc(20*var(--u));background:linear-gradient(#fffaf0,#f6e8c8);box-shadow:0 calc(3*var(--u)) 0 #c9ae78,0 calc(6*var(--u)) calc(10*var(--u)) rgba(90,60,20,.25);color:#7a5230;font-size:calc(14*var(--u));font-weight:700}
.pill b{font-size:calc(20*var(--u));color:#e0698f}
#sc{right:calc(14*var(--u))}
#bs{right:calc(14*var(--u));top:calc(62*var(--u));font-size:calc(12*var(--u));padding:calc(3*var(--u)) calc(12*var(--u))}
#bs b{font-size:calc(14*var(--u))}
#nx{left:calc(14*var(--u))}
#nx canvas{width:calc(46*var(--u));height:calc(46*var(--u))}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(14*var(--u));background:rgba(70,45,20,.55);color:#fff;font-size:calc(26*var(--u));font-weight:700;text-align:center}
#over.on{display:flex}
#over p{margin:0;font-size:calc(18*var(--u))}
#over button{border:0;border-radius:calc(24*var(--u));padding:calc(12*var(--u)) calc(36*var(--u));font:inherit;font-size:calc(18*var(--u));color:#fff;background:linear-gradient(#ff9ec4,#ec5f95);box-shadow:0 calc(4*var(--u)) 0 #b83f72;cursor:pointer}
#over button:active{transform:translateY(calc(3*var(--u)));box-shadow:0 calc(1*var(--u)) 0 #b83f72}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div class="pill" id="sc">امتیاز <b id="s">۰</b></div>
<div class="pill" id="bs">رکورد <b id="b">۰</b></div>
<div class="pill" id="nx"><canvas id="n" width="92" height="92"></canvas></div>
<div id="over"><div>بازی تموم شد</div><p>امتیاز: <span id="os">۰</span></p><button id="rb">دوباره</button></div>
</div>
<script>
const {Engine,Bodies,Body,Composite,Events}=Matter;
const W=400,H=640,CX=200,CY=390,R=170,WALL=18,GAP=38,DY=150,LINE=262;
const LV=[
{r:12,c:'#ffeef5',d:'#ffc4da',o:'#d98aa8'},
{r:17,c:'#fff6d8',d:'#ffe08f',o:'#d4aa4a',hp:1},
{r:22,c:'#ffd3a1',d:'#ffa550',o:'#c9762a',st:1},
{r:28,c:'#e3ebf5',d:'#a9b9cf',o:'#6f819c',hp:1},
{r:34,c:'#a9a4c4',d:'#6e6a8f',o:'#46425f',st:1},
{r:41,c:'#e3d4ff',d:'#b394f5',o:'#7d5cc4',hp:1},
{r:49,c:'#cdf7e4',d:'#7fdcb0',o:'#3fa97c'},
{r:58,c:'#d0ecff',d:'#79c0f5',o:'#3f89c4',hp:1},
{r:68,c:'#fff0a8',d:'#ffc93c',o:'#c9951a',st:1},
{r:79,c:'#ffd0e4',d:'#ff8fba',o:'#d1527f',hp:1}
];
const PTS=[1,3,6,10,15,21,28,36,45,55];
const fa=n=>Number(n).toLocaleString('fa-IR');
const tg=window.Telegram&&window.Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}}catch(e){}
const buzz=t=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};

const cv=document.getElementById('c'),g=cv.getContext('2d');
const app=document.getElementById('app');
const nc=document.getElementById('n'),ng=nc.getContext('2d');
let dpr=1;
function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;
  app.style.setProperty('--u',app.clientWidth/W+'px');
}
window.addEventListener('resize',fit);fit();

function cat(c,x,y,r,a,l,s){
  s=s||1;
  const L=LV[l],h=r*.94*s;
  c.save();c.translate(x,y);c.rotate(a);c.lineJoin='round';
  for(const m of[-1,1]){
    c.beginPath();c.moveTo(m*h*.2,-h*.92);c.lineTo(m*h*.82,-h*1.22);c.lineTo(m*h*.98,-h*.3);c.closePath();
    c.fillStyle=L.d;c.fill();c.lineWidth=Math.max(1,h*.05);c.strokeStyle=L.o;c.stroke();
    c.beginPath();c.moveTo(m*h*.4,-h*.9);c.lineTo(m*h*.74,-h*1.07);c.lineTo(m*h*.85,-h*.5);c.closePath();
    c.fillStyle='#ffb3c6';c.fill();
  }
  const gr=c.createRadialGradient(-h*.35,-h*.4,h*.1,0,0,h);
  gr.addColorStop(0,'#fff');gr.addColorStop(.35,L.c);gr.addColorStop(1,L.d);
  c.beginPath();c.arc(0,0,h,0,7);c.fillStyle=gr;c.fill();
  c.lineWidth=Math.max(1.2,h*.05);c.strokeStyle=L.o;c.stroke();
  if(L.st){
    c.strokeStyle=L.o;c.globalAlpha=.55;c.lineWidth=h*.07;c.lineCap='round';
    for(const k of[-1,0,1]){c.beginPath();c.moveTo(k*h*.22,-h*.95);c.lineTo(k*h*.22,-h*.64);c.stroke();}
    c.globalAlpha=1;
  }
  const ex=h*.38,ey=h*.02;
  for(const m of[-1,1]){
    if(L.hp){
      c.beginPath();c.arc(m*ex,ey+h*.06,h*.12,Math.PI*1.1,Math.PI*1.9);
      c.lineWidth=h*.065;c.lineCap='round';c.strokeStyle='#4a2f2a';c.stroke();
    }else{
      c.beginPath();c.ellipse(m*ex,ey,h*.1,h*.135,0,0,7);c.fillStyle='#3b2a2a';c.fill();
      c.beginPath();c.arc(m*ex-h*.03,ey-h*.05,h*.04,0,7);c.fillStyle='#fff';c.fill();
    }
    c.beginPath();c.ellipse(m*h*.6,h*.3,h*.13,h*.08,0,0,7);c.fillStyle='rgba(255,110,150,.45)';c.fill();
  }
  c.beginPath();c.moveTo(-h*.07,h*.17);c.lineTo(h*.07,h*.17);c.lineTo(0,h*.25);c.closePath();c.fillStyle='#ff8fa8';c.fill();
  c.beginPath();c.arc(-h*.07,h*.25,h*.07,Math.PI*.1,Math.PI*.9);c.moveTo(h*.14,h*.25);c.arc(h*.07,h*.25,h*.07,Math.PI*.1,Math.PI*.9);
  c.lineWidth=h*.045;c.lineCap='round';c.strokeStyle='#4a2f2a';c.stroke();
  if(r>=22){
    c.strokeStyle='rgba(80,50,50,.45)';c.lineWidth=Math.max(1,h*.02);
    for(const m of[-1,1])for(const d of[-.05,.07]){
      c.beginPath();c.moveTo(m*h*.72,h*(.24+d));c.lineTo(m*h*1.08,h*(.2+d*2.4));c.stroke();
    }
  }
  if(l>=5&&l<9){
    c.save();c.translate(h*.62,-h*.72);c.rotate(.4);c.fillStyle='#ff7aa8';
    for(const m of[-1,1]){c.beginPath();c.moveTo(0,0);c.lineTo(m*h*.3,-h*.17);c.lineTo(m*h*.3,h*.17);c.closePath();c.fill();}
    c.beginPath();c.arc(0,0,h*.07,0,7);c.fillStyle='#ff4f8b';c.fill();c.restore();
  }
  if(l===9){
    c.beginPath();c.moveTo(-h*.34,-h*.86);c.lineTo(-h*.38,-h*1.22);c.lineTo(-h*.17,-h*1.03);c.lineTo(0,-h*1.3);
    c.lineTo(h*.17,-h*1.03);c.lineTo(h*.38,-h*1.22);c.lineTo(h*.34,-h*.86);c.closePath();
    c.fillStyle='#ffd84a';c.fill();c.strokeStyle='#d99a1a';c.lineWidth=h*.04;c.stroke();
  }
  c.restore();
  c.save();c.translate(x-h*.42,y-h*.5);c.rotate(-.7);
  c.beginPath();c.ellipse(0,0,h*.26,h*.13,0,0,7);c.fillStyle='rgba(255,255,255,.65)';c.fill();
  c.restore();
  c.beginPath();c.arc(x-h*.1,y-h*.72,h*.05,0,7);c.fillStyle='rgba(255,255,255,.7)';c.fill();
}

const bg=document.createElement('canvas');bg.width=W*2;bg.height=H*2;
(function(){
  const b=bg.getContext('2d');b.scale(2,2);
  const T=40;
  b.fillStyle='#d8c298';b.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){
    b.fillStyle=((x+y)/T)%2?'#f2e4c8':'#e9d7b4';
    b.fillRect(x+1.5,y+1.5,T-3,T-3);
    b.fillStyle='rgba(255,255,255,.4)';b.fillRect(x+2,y+2,T-4,2);
    b.fillStyle='rgba(150,110,50,.12)';b.fillRect(x+2,y+T-4,T-4,2);
  }
  const vg=b.createRadialGradient(CX,CY,150,CX,CY,420);
  vg.addColorStop(0,'rgba(120,80,30,0)');vg.addColorStop(1,'rgba(120,80,30,.28)');
  b.fillStyle=vg;b.fillRect(0,0,W,H);
  const ig=b.createRadialGradient(CX-40,CY-50,20,CX,CY,R);
  ig.addColorStop(0,'#fffaea');ig.addColorStop(1,'#f1dfb8');
  b.beginPath();b.arc(CX,CY,R,0,7);b.fillStyle=ig;b.fill();
  b.save();b.beginPath();b.arc(CX,CY,R,0,7);b.clip();
  b.strokeStyle='rgba(180,140,80,.18)';b.lineWidth=1;
  for(let i=-R;i<=R;i+=34){b.beginPath();b.moveTo(CX+i,CY-R);b.lineTo(CX+i,CY+R);b.stroke();b.beginPath();b.moveTo(CX-R,CY+i);b.lineTo(CX+R,CY+i);b.stroke();}
  b.restore();
  const a0=(-90+GAP)*Math.PI/180,a1=(270-GAP)*Math.PI/180,rc=R+WALL/2;
  b.lineCap='round';
  b.save();b.shadowColor='rgba(80,50,10,.45)';b.shadowBlur=16;b.shadowOffsetY=6;
  b.lineWidth=WALL;b.strokeStyle='#59b043';b.beginPath();b.arc(CX,CY,rc,a0,a1);b.stroke();b.restore();
  const rg=b.createLinearGradient(0,CY-R-WALL,0,CY+R+WALL);
  rg.addColorStop(0,'#aee66f');rg.addColorStop(1,'#58b243');
  b.lineWidth=WALL;b.strokeStyle=rg;b.beginPath();b.arc(CX,CY,rc,a0,a1);b.stroke();
  b.lineWidth=3;b.strokeStyle='#cdf59f';b.beginPath();b.arc(CX,CY,R+3,a0,a1);b.stroke();
  b.strokeStyle='#3f8f33';b.beginPath();b.arc(CX,CY,R+WALL-2,a0,a1);b.stroke();
  let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  b.lineWidth=1.4;
  for(let i=0;i<280;i++){
    const a=a0+(a1-a0)*rnd(),rr=R+4+rnd()*(WALL-8),x=CX+rr*Math.cos(a),y=CY+rr*Math.sin(a);
    b.strokeStyle=rnd()>.5?'#85d65a':'#3d9a34';
    b.beginPath();b.moveTo(x,y);b.lineTo(x+Math.cos(a)*5+(rnd()-.5)*4,y+Math.sin(a)*5+(rnd()-.5)*4);b.stroke();
  }
  const fc=['#ffffff','#ffd1e1','#fff08a'];
  for(let i=0;i<26;i++){
    const a=a0+(a1-a0)*rnd(),x=CX+rc*Math.cos(a),y=CY+rc*Math.sin(a),col=fc[i%3];
    b.fillStyle=col;
    for(let k=0;k<5;k++){b.beginPath();b.arc(x+Math.cos(k*1.257)*2.6,y+Math.sin(k*1.257)*2.6,2.1,0,7);b.fill();}
    b.beginPath();b.arc(x,y,1.8,0,7);b.fillStyle='#f5a623';b.fill();
  }
})();

const engine=Engine.create({positionIterations:10,velocityIterations:8});
engine.gravity.y=1;
const world=engine.world;
(function(){
  const rc=R+WALL/2,len=2*rc*Math.tan(2.2*Math.PI/180)+4;
  for(let d=-90+GAP;d<=270-GAP;d+=4){
    const a=d*Math.PI/180;
    Composite.add(world,Bodies.rectangle(CX+rc*Math.cos(a),CY+rc*Math.sin(a),len,WALL,{isStatic:true,angle:a+Math.PI/2,friction:.3}));
  }
})();

let score=0,best=0,cur=0,nxt=0,dx=CX,ready=true,over=false,danger=0,parts=[];
try{best=+localStorage.getItem('catBest')||0}catch(e){}
const $=id=>document.getElementById(id);
const pick=()=>[0,0,1,1,2,3][Math.floor(Math.random()*6)];
function ui(){
  $('s').textContent=fa(score);$('b').textContent=fa(best);
  ng.clearRect(0,0,92,92);ng.save();ng.scale(2,2);cat(ng,23,26,15,0,nxt);ng.restore();
}
function lim(l){return R*Math.sin(GAP*Math.PI/180)-LV[l].r-4}
function setX(e){
  const rc=cv.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*W,m=lim(cur);
  dx=Math.max(CX-m,Math.min(CX+m,x));
}
function spawn(x,y,l,born,vx,vy){
  const b=Bodies.circle(x,y,LV[l].r,{restitution:.2,friction:.15,frictionStatic:.4,frictionAir:.002,density:.002});
  b.lv=l;b.born=born;b.t0=born?performance.now()-1000:performance.now();
  if(vx||vy)Body.setVelocity(b,{x:vx,y:vy});
  Composite.add(world,b);return b;
}
function drop(){
  if(!ready||over)return;
  spawn(dx,DY,cur,performance.now());
  buzz('light');
  ready=false;cur=nxt;nxt=pick();ui();
  dx=Math.max(CX-lim(cur),Math.min(CX+lim(cur),dx));
  setTimeout(()=>{ready=true},520);
}
cv.addEventListener('pointerdown',e=>{setX(e)});
cv.addEventListener('pointermove',setX);
cv.addEventListener('pointerup',e=>{setX(e);drop()});

function burst(x,y,l,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,v=1.5+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,s:2+Math.random()*3,c:i%2?'#fff':LV[l].d});
  }
}
Events.on(engine,'collisionStart',ev=>{
  if(over)return;
  for(const p of ev.pairs){
    const a=p.bodyA,b=p.bodyB;
    if(a.lv===undefined||a.lv!==b.lv||a.gone||b.gone)continue;
    a.gone=b.gone=true;
    const mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2,l=a.lv;
    const vx=(a.velocity.x+b.velocity.x)/2,vy=(a.velocity.y+b.velocity.y)/2;
    Composite.remove(world,a);Composite.remove(world,b);
    if(l===LV.length-1){score+=100;burst(mx,my,l,30);buzz('heavy');}
    else{score+=PTS[l+1];spawn(mx,my,l+1,0,vx,vy);burst(mx,my,l+1,14);buzz('medium');}
    if(score>best){best=score;try{localStorage.setItem('catBest',best)}catch(e){}}
    ui();
  }
});

function cats(){return Composite.allBodies(world).filter(b=>b.lv!==undefined)}
function check(dt){
  const now=performance.now();let bad=false;
  for(const b of cats())if(now-b.born>1500&&b.speed<2&&b.position.y-LV[b.lv].r<LINE)bad=true;
  danger=bad?danger+dt:0;
  if(danger>2000){
    over=true;$('os').textContent=fa(score);$('over').classList.add('on');buzz('heavy');
  }
}
function restart(){
  for(const b of cats())Composite.remove(world,b);
  score=0;cur=pick();nxt=pick();over=false;danger=0;parts=[];ready=true;dx=CX;
  $('over').classList.remove('on');ui();
}
$('rb').addEventListener('click',restart);

function render(t){
  g.setTransform(dpr,0,0,dpr,0,0);
  g.drawImage(bg,0,0,W,H);
  for(const b of cats()){
    const k=Math.min(1,(t-b.t0)/260),s=k<1?.6+.4*k+.15*Math.sin(k*Math.PI):1;
    cat(g,b.position.x,b.position.y,LV[b.lv].r,b.angle,b.lv,s);
  }
  for(const p of parts){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.025;
    g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.c;
    g.save();g.translate(p.x,p.y);g.rotate(p.life*6);g.fillRect(-p.s,-p.s,p.s*2,p.s*2);g.restore();
  }
  g.globalAlpha=1;parts=parts.filter(p=>p.life>0);
  if(danger>0){
    g.save();g.setLineDash([10,8]);g.lineWidth=3;
    g.strokeStyle='rgba(235,70,90,'+(.45+.45*Math.sin(t/90))+')';
    g.beginPath();g.moveTo(CX-R,LINE);g.lineTo(CX+R,LINE);g.stroke();g.restore();
  }
  if(!over){
    const r=LV[cur].r;
    g.save();g.setLineDash([6,8]);g.strokeStyle='rgba(120,80,30,.3)';g.lineWidth=2;
    g.beginPath();g.moveTo(dx,DY+r);g.lineTo(dx,CY+R-10);g.stroke();g.restore();
    g.globalAlpha=ready?1:.3;cat(g,dx,DY,r,0,cur);g.globalAlpha=1;
  }
}

let last=performance.now(),acc=0;
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  if(!over){
    acc+=dt;
    while(acc>=1000/60){Engine.update(engine,1000/60);acc-=1000/60;}
    check(dt);
  }
  render(t);
  requestAnimationFrame(loop);
}
cur=pick();nxt=pick();ui();
requestAnimationFrame(loop);
</script>
</body>
</html>
